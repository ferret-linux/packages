# ================================================================
#  packages — package build & release workflow
# ================================================================

name: Build packages

on:
  push:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - ".keepalive"
  pull_request:
  schedule:
    - cron: "00 00 * * *"
    - cron: "05 02 * * *"
    - cron: "10 04 * * *"
    - cron: "15 06 * * *"
    - cron: "20 08 * * *"
    - cron: "25 10 * * *"
    - cron: "30 12 * * *"
    - cron: "35 14 * * *"
    - cron: "40 16 * * *"
    - cron: "45 18 * * *"
    - cron: "50 20 * * *"
    - cron: "55 22 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    name: Keepalive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Keepalive
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          LAST="$(cat .keepalive 2>/dev/null | cut -d' ' -f1 || true)"
          if [[ "${LAST}" == "${TODAY}" ]]; then
            echo "Keepalive already ran today (${TODAY}), skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%d %H:%M:%S" > .keepalive
          git add .keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive ${TODAY}"
          git push || true

  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - helium-drm
          - gui-cli
          - docker-ce
          - fedora-logos
          - plasma-lookandfeel-fedora
          - zutils-rs
          - resources
          - pods
          - incus-ui
          - wm-noctalia
          - gnome-shell-extensions
          - udev-rules
          - lazydocker
          - pika-backup
          - extension-manager
          - nvidia-container-toolkit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create output directory
        run: mkdir -p output/${{ matrix.package }}

      - name: Build ${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -v "${{ github.workspace }}/${{ matrix.package }}:/build/${{ matrix.package }}:ro" \
            -v "${{ github.workspace }}/output/${{ matrix.package }}:/output" \
            quay.io/fedora/fedora-bootc:latest \
            bash /build/${{ matrix.package }}/build.sh

      - name: Verify RPM
        run: |
          ls -lh output/${{ matrix.package }}/
          [[ "$(ls output/${{ matrix.package }}/*.rpm 2>/dev/null | wc -l)" -gt 0 ]] \
            || { echo "No RPMs found"; exit 1; }

      - name: Sanitize RPM filenames
        run: |
          for rpm in output/${{ matrix.package }}/*.rpm; do
            clean="$(dirname "$rpm")/$(basename "$rpm" \
              | sed 's/^[0-9]*://' \
              | sed 's/-[0-9]*:/-/' \
              | sed 's/\^/-/g')"
            [[ "$rpm" != "$clean" ]] && mv "$rpm" "$clean" || true
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rpms-${{ matrix.package }}
          path: output/${{ matrix.package }}/*.rpm
          retention-days: 1

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: rpms-*
          path: all-rpms
          merge-multiple: true

      - name: List all RPMs
        run: |
          echo "All RPMs:"
          ls -lh all-rpms/
          [[ "$(ls all-rpms/*.rpm 2>/dev/null | wc -l)" -gt 0 ]] \
            || { echo "No RPMs found"; exit 1; }

      - name: Sign RPMs
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        run: |
          docker run --rm \
            -e RPM_GPG_PRIVATE_KEY \
            -v "${{ github.workspace }}/all-rpms:/rpms" \
            quay.io/fedora/fedora:45 \
            bash -c '
              set -e
              dnf install -y -q rpm-sign >/dev/null
              printf "%s\n" "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
              rpm --addsign --define "_gpg_name Ferret Linux Repository" /rpms/*.rpm
              rpm -qpi /rpms/*.rpm 2>/dev/null | grep -i -m3 -A1 signature || true
            '

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RESIGN: ${{ vars.FORCE_RESIGN }}
        run: |
          if ! gh release view "pkgs-rpm" \
              --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "pkgs-rpm" \
              --repo "${{ github.repository }}" \
              --title "pkgs-rpm" \
              --latest=false \
              --notes "**built:** \`$(date -u '+%Y-%m-%d %H:%M UTC')\`" \
              all-rpms/*.rpm
            exit 0
          fi

          # One-time migration: replace existing unsigned assets with signed
          # ones. Controlled by the FORCE_RESIGN repository variable.
          if [[ "${FORCE_RESIGN:-}" == "true" ]]; then
            echo "FORCE_RESIGN: re-uploading all assets with --clobber"
            gh release upload "pkgs-rpm" all-rpms/*.rpm \
              --repo "${{ github.repository }}" --clobber
            exit 0
          fi

          # A published NVR is immutable. Rebuilding the same NVR produces
          # different bytes (rpm records the build time), and re-uploading it
          # while the website repodata still describes the old bytes makes
          # every image build fail with "checksum doesn't match" until Pages
          # catches up. Keep the already-published asset and only upload
          # genuinely new NVRs, so repodata only changes when a package is
          # actually updated.
          gh release view "pkgs-rpm" \
            --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' > /tmp/published-assets.txt

          for rpm in all-rpms/*.rpm; do
            base="$(basename "$rpm")"
            if grep -qxF "${base}" /tmp/published-assets.txt; then
              echo "keeping published ${base}"
              continue
            fi
            echo "uploading ${base}"
            gh release upload "pkgs-rpm" "$rpm" \
              --repo "${{ github.repository }}"
          done

  update-repo:
    name: Update DNF repo metadata
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write

    steps:
      - name: Checkout website repo
        uses: actions/checkout@v6
        with:
          repository: ferret-linux/ferret-linux.github.io
          token: ${{ secrets.WEBSITE_REPO_PAT }}
          path: website

      - name: Install createrepo
        run: sudo apt-get install -y createrepo-c

      - name: Download published RPMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download from the release rather than from the build artifacts:
          # GitHub normalizes uploaded asset names (e.g. `~` becomes `.`), so
          # repodata built from local filenames would point at URLs that 404.
          mkdir -p all-rpms
          gh release download pkgs-rpm \
            --repo "${{ github.repository }}" \
            --pattern '*.rpm' \
            --dir all-rpms

      - name: Update repodata
        run: |
          REPODIR="website/repo/pkgs/x86_64"
          mkdir -p "$REPODIR"
          rm -rf "$REPODIR"/repodata

          # Generate repodata from RPMs but don't copy RPMs into website repo
          TMPDIR=$(mktemp -d)
          cp all-rpms/*.rpm "$TMPDIR/"
          createrepo_c \
            --baseurl "https://github.com/ferret-linux/packages/releases/download/pkgs-rpm/" \
            "$TMPDIR"

          # Only copy repodata (no RPMs) into website repo
          cp -r "$TMPDIR/repodata" "$REPODIR/"

      - name: Sign repodata
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        run: |
          printf "%s\n" "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --armor --detach-sign \
            -o website/repo/pkgs/x86_64/repodata/repomd.xml.asc \
            website/repo/pkgs/x86_64/repodata/repomd.xml
          gpg --verify \
            website/repo/pkgs/x86_64/repodata/repomd.xml.asc \
            website/repo/pkgs/x86_64/repodata/repomd.xml

      - name: Commit and push repodata
        run: |
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "repo: update repodata $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push