# ================================================================
#  packages — package build & release workflow
# ================================================================

name: Build packages

on:
  push:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - ".keepalive"
  pull_request:
  schedule:
    - cron: "00 00 * * *"
    - cron: "05 02 * * *"
    - cron: "10 04 * * *"
    - cron: "15 06 * * *"
    - cron: "20 08 * * *"
    - cron: "25 10 * * *"
    - cron: "30 12 * * *"
    - cron: "35 14 * * *"
    - cron: "40 16 * * *"
    - cron: "45 18 * * *"
    - cron: "50 20 * * *"
    - cron: "55 22 * * *"
  workflow_dispatch:
    inputs:
      force_packages:
        description: "Comma-separated package names to rebuild even if their RPMs are already published"
        required: false
        default: ""

jobs:
  keepalive:
    name: Keepalive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keepalive
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          LAST="$(cat .keepalive 2>/dev/null | cut -d' ' -f1 || true)"
          if [[ "${LAST}" == "${TODAY}" ]]; then
            echo "Keepalive already ran today (${TODAY}), skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%d %H:%M:%S" > .keepalive
          git add .keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive ${TODAY}"
          git push || true

  resolve:
    name: Resolve packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      any: ${{ steps.resolve.outputs.any }}
      expected_all: ${{ steps.resolve.outputs.expected_all }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --print-nvr runs the same version-detection code as the real build,
      # inside the same container. If any probe fails, this job fails and all
      # downstream jobs (build/publish/prune/update-repo) are skipped — no
      # incomplete expected set can ever reach the prune step.
      - name: Probe expected RPMs and resolve build matrix
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD_PACKAGES: ${{ vars.FORCE_BUILD_PACKAGES }}
          INPUT_FORCE_PACKAGES: ${{ github.event.inputs.force_packages }}
        run: |
          set -euo pipefail

          if gh release view pkgs-rpm --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view pkgs-rpm --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' > /tmp/published.txt
          else
            : > /tmp/published.txt
          fi
          echo "published assets: $(wc -l < /tmp/published.txt)"

          : > /tmp/force.txt
          FORCE_LIST="${INPUT_FORCE_PACKAGES:-},${FORCE_BUILD_PACKAGES:-}"
          IFS=',' read -ra _parts <<< "$FORCE_LIST"
          for p in "${_parts[@]}"; do
            p="$(printf '%s' "$p" | tr -d '[:space:]')"
            [[ -n "$p" ]] && printf '%s\n' "$p" >> /tmp/force.txt
          done

          PROBE_DIR="$(mktemp -d)"
          mkdir -p "$PROBE_DIR/output"
          trap 'rm -rf "$PROBE_DIR"' EXIT

          docker run --rm \
            -e GITHUB_TOKEN \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$PROBE_DIR/output:/output" \
            -v "$PROBE_DIR:/probe" \
            quay.io/fedora/fedora-bootc:latest \
            bash /repo/.github/scripts/probe.sh /probe/results.tsv

          [[ -s "$PROBE_DIR/results.tsv" ]] || { echo "no packages were probed" >&2; exit 1; }

          python3 - /tmp/published.txt /tmp/force.txt "$PROBE_DIR/results.tsv" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          published_path, force_path, tsv_path, out_path = sys.argv[1:5]

          with open(published_path) as fh:
              published = {line.strip() for line in fh if line.strip()}
          with open(force_path) as fh:
              forced = {line.strip() for line in fh if line.strip()}

          rows = []
          all_expected = []
          skipped = []
          building = []

          with open(tsv_path) as fh:
              for line in fh:
                  fields = line.rstrip("\n").split("\t")
                  pkg = fields[0]
                  expected = [name for name in fields[1:] if name]
                  all_expected.extend(expected)

                  missing = [name for name in expected if name not in published]
                  if pkg in forced or missing:
                      building.append(pkg)
                      rows.append({"package": pkg, "expected": expected})
                  else:
                      skipped.append(pkg)

          print("skipped:")
          print("  " + ("\n  ".join(skipped) if skipped else "none"))
          print("building:")
          print("  " + ("\n  ".join(building) if building else "none"))
          print(f"live expected RPMs: {len(all_expected)}")

          with open(out_path, "a") as out:
              out.write("matrix=" + json.dumps({"include": rows}) + "\n")
              out.write("any=" + ("true" if rows else "false") + "\n")
              out.write("expected_all=" + json.dumps(all_expected) + "\n")
          PY

  build:
    name: Build ${{ matrix.package }}
    needs: resolve
    if: needs.resolve.outputs.any == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create output directory
        run: mkdir -p output/${{ matrix.package }}

      - name: Build ${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -v "${{ github.workspace }}/${{ matrix.package }}:/build/${{ matrix.package }}:ro" \
            -v "${{ github.workspace }}/output/${{ matrix.package }}:/output" \
            quay.io/fedora/fedora-bootc:latest \
            bash /build/${{ matrix.package }}/build.sh

      - name: Verify RPMs
        run: |
          ls -lh output/${{ matrix.package }}/
          [[ "$(find output/${{ matrix.package }} -maxdepth 1 -name '*.rpm' | wc -l)" -gt 0 ]] \
            || { echo "No RPMs found"; exit 1; }

      - name: Sanitize RPM filenames
        run: bash .github/scripts/sanitize.sh "output/${{ matrix.package }}"

      # Exact set: a missing RPM means the probe and the build disagree (a
      # package changed shape upstream, or detection is broken). An extra RPM
      # would be uploaded and then immediately pruned, so fail here instead.
      - name: Assert exact expected RPM set
        env:
          EXPECTED_JSON: ${{ toJson(matrix.expected) }}
        run: |
          python3 - "$EXPECTED_JSON" "output/${{ matrix.package }}" <<'PY'
          import json
          import os
          import sys

          expected = set(json.loads(sys.argv[1]))
          directory = sys.argv[2]
          actual = {name for name in os.listdir(directory) if name.endswith(".rpm")}

          missing = sorted(expected - actual)
          extra = sorted(actual - expected)
          if missing or extra:
              print("missing RPMs:", missing, file=sys.stderr)
              print("extra RPMs:", extra, file=sys.stderr)
              sys.exit(1)
          print("exact RPM set verified:", sorted(actual))
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpms-${{ matrix.package }}
          path: output/${{ matrix.package }}/*.rpm
          retention-days: 1

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build, resolve]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rpms-*
          path: all-rpms
          merge-multiple: true

      - name: List all RPMs
        run: |
          echo "All RPMs:"
          ls -lh all-rpms/
          [[ "$(find all-rpms -maxdepth 1 -name '*.rpm' | wc -l)" -gt 0 ]] \
            || { echo "No RPMs found"; exit 1; }

      - name: Sign RPMs
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        run: |
          docker run --rm \
            -e RPM_GPG_PRIVATE_KEY \
            -v "${{ github.workspace }}/all-rpms:/rpms" \
            quay.io/fedora/fedora:latest \
            bash -c '
              set -e
              dnf install -y -q rpm-sign >/dev/null
              printf "%s\n" "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
              # Vendor RPMs (e.g. NVIDIA) may carry a legacy signature that
              # rpm --addsign refuses to coexist with. Strip first, then sign
              # every RPM with our key only.
              for f in /rpms/*.rpm; do
                rpm --delsign "$f" >/dev/null 2>&1 || true
                rpm --addsign --define "_gpg_name Ferret Linux Repository" "$f"
              done
              rpm -qpi /rpms/*.rpm 2>/dev/null | grep -i -m3 -A1 signature || true
            '

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RESIGN: ${{ vars.FORCE_RESIGN }}
        run: |
          if ! gh release view "pkgs-rpm" \
              --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "pkgs-rpm" \
              --repo "${{ github.repository }}" \
              --title "pkgs-rpm" \
              --latest=false \
              --notes "**built:** \`$(date -u '+%Y-%m-%d %H:%M UTC')\`" \
              all-rpms/*.rpm
            exit 0
          fi

          # One-time migration: replace existing unsigned assets with signed
          # ones. Controlled by the FORCE_RESIGN repository variable.
          if [[ "${FORCE_RESIGN:-}" == "true" ]]; then
            echo "FORCE_RESIGN: re-uploading all assets with --clobber"
            gh release upload "pkgs-rpm" all-rpms/*.rpm \
              --repo "${{ github.repository }}" --clobber
            exit 0
          fi

          # A published NVR is immutable. Rebuilding the same NVR produces
          # different bytes (rpm records the build time), and re-uploading it
          # while the website repodata still describes the old bytes makes
          # every image build fail with "checksum doesn't match" until Pages
          # catches up. Keep the already-published asset and only upload
          # genuinely new NVRs, so repodata only changes when a package is
          # actually updated.
          gh release view "pkgs-rpm" \
            --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' > /tmp/published-assets.txt

          for rpm in all-rpms/*.rpm; do
            base="$(basename "$rpm")"
            if grep -qxF "${base}" /tmp/published-assets.txt; then
              echo "keeping published ${base}"
              continue
            fi
            echo "uploading ${base}"
            gh release upload "pkgs-rpm" "$rpm" \
              --repo "${{ github.repository }}"
          done

      # Pure GitHub set difference. `expected_all` is the union of every
      # --print-nvr result from resolve (including packages that were skipped),
      # so it is the complete live RPM set for this run. Anything else in the
      # release is a superseded version from an earlier run.
      - name: Prune superseded release assets
        if: ${{ vars.PRUNE_ORPHANS != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_JSON: ${{ needs.resolve.outputs.expected_all }}
          PRUNE_ORPHANS: ${{ vars.PRUNE_ORPHANS }}
        run: |
          set -euo pipefail
          [[ "${PRUNE_ORPHANS:-}" == "false" ]] && { echo "PRUNE_ORPHANS=false — skipping"; exit 0; }

          python3 - "$EXPECTED_JSON" > /tmp/keep.txt <<'PY'
          import json
          import sys
          for name in json.loads(sys.argv[1]):
              print(name)
          PY

          gh release view "pkgs-rpm" \
            --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' \
            | grep '\.rpm$' > /tmp/published.txt || true

          comm -13 <(sort -u /tmp/keep.txt) <(sort -u /tmp/published.txt) > /tmp/extra.txt

          if [[ ! -s /tmp/extra.txt ]]; then
            echo "no superseded assets"
            exit 0
          fi

          echo "pruning superseded assets:"
          cat /tmp/extra.txt
          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            gh release delete-asset "pkgs-rpm" "$asset" \
              --repo "${{ github.repository }}" --yes
          done < /tmp/extra.txt

  update-repo:
    name: Update DNF repo metadata
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write

    steps:
      - name: Checkout website repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ferret-linux/ferret-linux.github.io
          token: ${{ secrets.WEBSITE_REPO_PAT }}
          path: website

      - name: Install createrepo
        run: sudo apt-get install -y createrepo-c

      - name: Download published RPMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download from the release rather than from the build artifacts:
          # GitHub normalizes uploaded asset names (e.g. `~` becomes `.`), so
          # repodata built from local filenames would point at URLs that 404.
          mkdir -p all-rpms
          gh release download pkgs-rpm \
            --repo "${{ github.repository }}" \
            --pattern '*.rpm' \
            --dir all-rpms

      - name: Update repodata
        run: |
          REPODIR="website/repo/pkgs/x86_64"
          mkdir -p "$REPODIR"
          rm -rf "$REPODIR"/repodata

          # Generate repodata from RPMs but don't copy RPMs into website repo
          TMPDIR=$(mktemp -d)
          cp all-rpms/*.rpm "$TMPDIR/"
          createrepo_c \
            --baseurl "https://github.com/ferret-linux/packages/releases/download/pkgs-rpm/" \
            "$TMPDIR"

          # Only copy repodata (no RPMs) into website repo
          cp -r "$TMPDIR/repodata" "$REPODIR/"

      - name: Sign repodata
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        run: |
          printf "%s\n" "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --armor --detach-sign \
            -o website/repo/pkgs/x86_64/repodata/repomd.xml.asc \
            website/repo/pkgs/x86_64/repodata/repomd.xml
          gpg --verify \
            website/repo/pkgs/x86_64/repodata/repomd.xml.asc \
            website/repo/pkgs/x86_64/repodata/repomd.xml

      - name: Commit and push repodata
        run: |
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "repo: update repodata $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
